name: Build Android APK

    on:
      push:
        branches: [ main ]
      workflow_dispatch:

    permissions:
      contents: write

    jobs:
      build:
        name: Build Flutter APK
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '17'
          - uses: subosito/flutter-action@v2
            with:
              channel: 'stable'
          - name: Build Release APK
            working-directory: ./mobile
            run: |
              flutter create --platforms=android --org=com.antigravity.chat .
              flutter pub get
              flutter build apk --release
          - name: Upload Artifact
            uses: actions/upload-artifact@v4
            with:
              name: antigravity-chat-apk
              path: mobile/build/app/outputs/flutter-apk/app-release.apk
          - name: Create GitHub Release
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              cp mobile/build/app/outputs/flutter-apk/app-release.apk antigravity-chat.apk
              gh release create v1.0.0 antigravity-chat.apk --title "Antigravity Chat v1.0.0
  (APK)" --notes "Tải file antigravity-chat.apk bên dưới về cài đặt trên Android" || gh
  release upload v1.0.0 antigravity-chat.apk --clobber
